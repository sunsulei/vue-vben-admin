# name: Dependabot post-update
name: Build detection
on:
  push:
    branches:
      - dev
      - dev-*
      - release-*
      - main

jobs:
  post-update:
    runs-on: ubuntu-22.04
    env:
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          pnpm run build:ele

      - name: Build Docker image
        run: |
          docker build -t "registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:${{ github.run_number }}" ./apps/web-ele/
          docker build -t "registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:latest" ./apps/web-ele/

      - name: Login aliyun Registry
        run: |
          docker login -u ${{ secrets.ALIYUN_DOCKER_USERNAME }} -p '${{ secrets.ALIYUN_DOCKER_PASSWORD }}' registry.cn-hongkong.aliyuncs.com
      - name: push docker image
        run: |
          docker push registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:${{ github.run_number }}
          docker push registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:latest
