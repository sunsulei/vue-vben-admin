# name: Dependabot post-update
name: Build detection
on:
  push:
    branches:
      - dev
      - dev-*
      - release-*
      - main

env:
  HUSKY: '0'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  post-update:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Build
        run: |
          pnpm run build

      - name: Build Docker image
        run: |
          docker build -t "registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:${{ github.run_number }}" ./apps/web-ele/
          docker build -t "registry.cn-hongkong.aliyuncs.com/sunsulei/$REPO_NAME-${GITHUB_REF##*/}:latest" ./apps/web-ele/
